# The hypnose-sleap environment: runs the whole pipeline in one interpreter.
#
# - Both parquet engines: fastparquet reads the baselines, pyarrow is what
#   hypnose-behavior writes with.
# - `sleap-io` is pinned to 0.5.7, the version that read every baseline `.slp`.
#   sleap 1.5.2 pins it only as a floor (`>=0.5.7`), so leaving it open resolves to
#   0.9.2 and folds the highest-risk variable into the environment switch. Bumping it
#   is its own one-variable experiment.
# - `sleap` is 1.5.2: the version both current envs run and the newest on PyPI below
#   1.6. There is no 1.5.5 release; `sleap_v1.5.5` is a folder name in ../sleap-models.
# - Default torch here is CPU. GPU wheels come from a custom index -- see the README.
# - The three editable installs assume sibling checkouts beside this repo.
name: hypnose-sleap
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.12,<3.13
  - numpy<2
  - pandas
  - pyarrow
  - fastparquet
  - pyyaml
  - tqdm
  - h5py
  - pillow
  - matplotlib
  - scipy
  - opencv
  - dotmap
  - ipython
  - ipykernel
  - ipywidgets
  - pip
  - pip:
    - sleap==1.5.2
    - sleap-io==0.5.7
    - swc-aeon==0.1.0
    - harp-python
    - moviepy
    - -e ../hypnose-helpers
    - -e ../hypnose-behavior
    - -e .
